<!doctype html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play Albion On-line</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="page-game">
<div id="page-game" class="page">
<canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<video id="video-overlay" playsinline disablepictureinpicture oncontextmenu="event.preventDefault()" tabindex="-1"></video>
<div id="start-overlay"><button id="btn-start" type="button">▶ Start Albion</button></div>
</div>
<div id="ui-container">
<div id="topbar">
<div class="buttons">
<button id="btn-game" class="active" type="button">Game</button>
<button id="btn-settings" type="button">Settings</button>
<button id="btn-share" type="button" style="display: none;">Share</button>
<button id="btn-log" type="button">Log</button>
<button id="btn-export-saves" type="button">Export saves</button>
<button id="btn-import-saves" type="button">Import saves</button>
</div>
<div id="status-text"></div>
<div class="end-group">
<button id="btn-fullscreen" type="button">Fullscreen</button>
<button id="btn-mobile-menu" class="phone-only" type="button">Menu/Back</button>
<button id="btn-mobile-map" class="phone-only" type="button">Map</button>
<button id="btn-mobile-selection" class="phone-only" type="button">Selection mode</button>
<div id="credits"><a href="https://github.com/IS4Code/Albion">Made by IS4</a></div>
</div>
</div>
<section id="pages">
<div id="page-settings" class="page">
<div id="settings-panel"></div>
</div>
<div id="page-log" class="page">
<textarea id="output" rows="8" readonly></textarea>
</div>
</section>
</div>
<input id="import-saves-input" type="file" accept=".zip,application/zip" style="display: none;">
<input id="mobile-kbd-trigger" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" tabindex="-1">
<script type="text/javascript" src="controls.js"></script>
<script type="text/javascript" src="mobile.js"></script>
<script type="text/javascript" src="settings.js"></script>
<script type="text/javascript" src="module.js"></script>
<script type="text/javascript" src="video.js"></script>
<script type="text/javascript" src="saves.js"></script>
<script type="text/javascript" src="share.js"></script>
<template id="deferred-module-script">{{{ SCRIPT }}}</template>
<script type="text/javascript">
window.addEventListener('load', function () {
  var tmpl = document.getElementById('deferred-module-script');
  document.body.appendChild(tmpl.content.cloneNode(true));
});
</script>
</body>
</html>
